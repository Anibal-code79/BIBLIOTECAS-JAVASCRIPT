<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>

<body>

    <h1>Calculadora</h1>

    <form id="formulario">

        <input
            type="number"
            id="numero1"
            placeholder="Primeiro número"
        >

        <input
            type="number"
            id="numero2"
            placeholder="Segundo número"
        >

        <button type="submit">
            Somar
        </button>

    </form>

    <p id="resultado"></p>

    <!-- jQuery -->
    <script src="/Aula1/JS/jquery-4.0.0.js"></script>

    <script src="script.js"></script>

</body>

</html>
