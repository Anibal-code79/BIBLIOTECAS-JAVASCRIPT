<form id="formTemp">

    <input
        type="number"
        id="valor"
        placeholder="Temperatura"
    >

    <select id="direcao">

        <option value="c-f">
            Celsius → Fahrenheit
        </option>

        <option value="f-c">
            Fahrenheit → Celsius
        </option>

    </select>

    <button type="submit">
        Converter
    </button>

</form>

<p id="saidaTemp"></p>
